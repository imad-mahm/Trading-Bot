# Download daily ETF price history (gold, silver, oil, stocks, bonds...) for
# `python run.py backtest --all --universe markets`, and publish it as a
# downloadable artifact named "market-data".
#
# Why GitHub Actions? Yahoo Finance is reachable from GitHub's runners, so this
# works even when your own network or a sandbox can't reach it. Run it from the
# Actions tab ("Run workflow"); then download the artifact and unzip it into
# your project's data/ folder. (Or just run `python run.py download --universe
# markets` on your own machine.)

name: market-data

on:
  workflow_dispatch: {}
  push:
    branches: [multi-asset]
    paths: [".github/workflows/market-data.yml", "src/market_data.py"]

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download + validate market data
        run: python run.py download --universe markets

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: data/mkt_*.parquet
          retention-days: 30
